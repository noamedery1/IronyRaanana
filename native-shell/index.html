<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Squadio</title>
  <style>
    :root { --bg:#070b16; --card:#0c1324; --line:rgba(255,255,255,.08); --text:#e8edf7; --dim:#94a3b8; --accent:#3b82f6; --accent2:#0891b2; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; }
    body {
      background: radial-gradient(circle at 50% -10%, #0d1530, #070b16 70%);
      color: var(--text); font-family: 'Assistant', system-ui, sans-serif;
      display:flex; flex-direction:column; align-items:center; padding: max(24px, env(safe-area-inset-top)) 18px 24px;
      min-height:100%;
    }
    .wrap { width:100%; max-width:440px; display:flex; flex-direction:column; gap:1rem; margin-top: 6vh; visibility:hidden; }
    .brand { text-align:center; margin-bottom:.5rem; }
    .brand h1 { margin:.2rem 0 0; font-size:1.9rem; font-weight:900; letter-spacing:-.02em;
      background:linear-gradient(120deg,#60a5fa,#22d3ee); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .brand p { margin:.3rem 0 0; color:var(--dim); font-size:.9rem; }
    .logo { width:64px; height:64px; border-radius:18px; background:#fff; padding:6px; object-fit:contain; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:1.1rem 1.1rem 1.2rem; box-shadow:0 30px 70px -30px rgba(0,0,0,.9); }
    label { display:block; font-weight:700; margin-bottom:.5rem; font-size:.95rem; }
    .hint { color:var(--dim); font-size:.8rem; margin:.1rem 0 .7rem; line-height:1.5; }
    input { width:100%; padding:.85rem; border-radius:12px; border:1px solid #243049; background:#0b1220; color:var(--text); outline:none; font-size:16px; font-family:inherit; }
    input:focus { border-color:var(--accent); }
    button { font-family:inherit; cursor:pointer; border:none; }
    .primary { width:100%; margin-top:.8rem; padding:.9rem; border-radius:12px; font-weight:800; font-size:1rem; color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .primary:active { filter:brightness(.95); }
    .err { color:#f87171; font-size:.85rem; margin-top:.6rem; min-height:1em; }
    .recent { margin-top:.4rem; }
    .recent h2 { font-size:.85rem; color:var(--dim); font-weight:700; margin:.2rem 0 .5rem; }
    .club { display:flex; align-items:center; gap:.5rem; background:#0b1220; border:1px solid var(--line); border-radius:12px; padding:.55rem .7rem; margin-bottom:.5rem; }
    .club .name { flex:1; font-weight:700; }
    .club .go { background:#11213f; color:#cbd5e1; border:1px solid var(--line); border-radius:9px; padding:.4rem .8rem; font-weight:700; font-size:.82rem; }
    .club .go.mgr { background:none; color:#94a3b8; }
    .foot { text-align:center; color:#64748b; font-size:.75rem; margin-top:1rem; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="icon.png" alt="" onerror="this.style.display='none'" />
      <h1>Squadio</h1>
      <p>מערכת הלו״ז למועדוני ספורט</p>
    </div>

    <div class="card">
      <label for="inp">כניסה עם קישור הזמנה או קוד מועדון</label>
      <div class="hint">הדביקו את קישור ההזמנה שקיבלתם (הורה / מפעיל / מאמן), או הקלידו את קוד המועדון. מנהל — הדביקו את קישור הניהול.</div>
      <input id="inp" inputmode="url" placeholder="הדביקו קישור, או קוד מועדון (למשל fcraanana)" autocapitalize="off" autocomplete="off" spellcheck="false" />
      <button class="primary" id="enter">כניסה ←</button>
      <div class="err" id="err"></div>
    </div>

    <div class="recent card" id="recentCard" style="display:none">
      <h2>מועדונים אחרונים</h2>
      <div id="recent"></div>
    </div>

    <div class="foot">אפליקציה אחת לכל המועדונים. כדי להחליף מועדון או להוסיף קישור אחר — לחצו על <b>כפתור ה״חזור״</b> של הטלפון כדי לחזור למסך הזה.</div>
  </div>

  <script>
    var BASE = 'https://squadio.techbynoam.com';
    var SUB = '.squadio.techbynoam.com';
    var inp = document.getElementById('inp');
    var err = document.getElementById('err');

    function clubUrl(slug)  { return 'https://' + slug + SUB + '/' + slug; }
    function adminUrl(slug) { return 'https://' + slug + SUB + '/' + slug + '/admin'; }

    function slugFromUrl(u) {
      try {
        var url = new URL(u);
        var host = url.hostname.toLowerCase();
        if (host.endsWith(SUB)) { var s = host.slice(0, -SUB.length); if (s && s.indexOf('.') < 0 && s !== 'www') return s; }
        var seg = url.pathname.split('/').filter(Boolean)[0];
        return seg ? seg.toLowerCase() : '';
      } catch (e) { return ''; }
    }

    function getRecent() { try { return JSON.parse(localStorage.getItem('recentClubs') || '[]'); } catch (e) { return []; } }
    // Mirror the clubs to native storage (Capacitor Preferences → Android SharedPreferences) so the
    // home-screen widget can read them without the user configuring anything.
    function syncNative(list) {
      try {
        if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Preferences) {
          Capacitor.Plugins.Preferences.set({ key: 'squadio_clubs', value: JSON.stringify(list || []) });
        }
      } catch (e) { /* non-native / plugin missing */ }
    }
    function saveRecent(slug) {
      if (!slug) return;
      var list = getRecent().filter(function (s) { return s !== slug; });
      list.unshift(slug);
      var trimmed = list.slice(0, 6);
      try { localStorage.setItem('recentClubs', JSON.stringify(trimmed)); } catch (e) {}
      syncNative(trimmed);
    }

    function go(url, slug) { if (slug) saveRecent(slug); window.location.href = url; }

    function enter() {
      err.textContent = '';
      var raw = inp.value.trim();
      if (!raw) { err.textContent = 'הדביקו קישור או הקלידו קוד מועדון'; return; }
      if (/^https?:\/\//i.test(raw)) {
        // A full invite/admin link — go straight to it (keeps role/team in the path).
        go(raw, slugFromUrl(raw));
      } else {
        var slug = raw.toLowerCase().replace(/[^a-z0-9-]/g, '');
        if (!slug) { err.textContent = 'קוד מועדון לא תקין'; return; }
        go(clubUrl(slug), slug);
      }
    }

    document.getElementById('enter').addEventListener('click', enter);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });

    function renderRecent(list) {
      if (!list.length) return;
      var box = document.getElementById('recent');
      box.innerHTML = '';
      list.forEach(function (slug) {
        var row = document.createElement('div');
        row.className = 'club';
        var name = document.createElement('div'); name.className = 'name'; name.textContent = slug;
        var enterBtn = document.createElement('button'); enterBtn.className = 'go'; enterBtn.textContent = 'כניסה';
        enterBtn.addEventListener('click', function () { go(clubUrl(slug), slug); });
        var mgrBtn = document.createElement('button'); mgrBtn.className = 'go mgr'; mgrBtn.textContent = 'מנהל';
        mgrBtn.addEventListener('click', function () { go(adminUrl(slug), slug); });
        row.appendChild(name); row.appendChild(mgrBtn); row.appendChild(enterBtn);
        box.appendChild(row);
      });
      document.getElementById('recentCard').style.display = '';
    }

    function showHome(list) {
      renderRecent(list);
      // Once a club exists, the input card is "add another", not the main action.
      if (list.length) document.querySelector('label[for="inp"]').textContent = 'הוספת מועדון / קישור חדש';
      document.querySelector('.wrap').style.visibility = 'visible';
    }

    // Entry behaviour:
    //  - cold start + exactly ONE saved club  → go straight in (no chooser).
    //  - cold start + several clubs, or none  → show this home screen.
    //  - navigating BACK here (same session)  → always show it, so you can switch / add a club.
    (function boot() {
      var list = getRecent();
      syncNative(list); // keep the widget's club list fresh on every open
      var backHome = false;
      try { backHome = !!sessionStorage.getItem('homeShown'); sessionStorage.setItem('homeShown', '1'); } catch (e) {}
      if (!backHome && list.length === 1) { go(clubUrl(list[0]), list[0]); return; }
      showHome(list);
    })();
  </script>
</body>
</html>
