<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img" aria-label="Squadio">
  <defs>
    <linearGradient id="sq-shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- club crest / shield -->
  <path d="M50 12 L86 23 V49 C86 71 70 84 50 90 C30 84 14 71 14 49 V23 Z"
        fill="url(#sq-shield)"/>
  <path d="M50 12 L86 23 V49 C86 71 70 84 50 90 C30 84 14 71 14 49 V23 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <!-- upward chevrons = momentum / progress -->
  <g fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 54 L50 40 L66 54"/>
    <path d="M34 66 L50 52 L66 66" stroke-opacity="0.55"/>
  </g>
  <!-- live dot -->
  <circle cx="78" cy="22" r="7" fill="#38bdf8" stroke="#0b1220" stroke-width="3"/>
  <!-- wordmark -->
  <text x="104" y="64" font-family="Poppins, Heebo, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#0b1220">
    Squad<tspan fill="#0d9488">io</tspan>
  </text>
</svg>
