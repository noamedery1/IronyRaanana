<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7a18" />
    <!-- PWA / iOS add-to-home-screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="רעננה לו&quot;ז" />
    <title>עירוני רעננה — לו"ז אימונים</title>
  </head>
  <body>
    <div id="root">
      <!-- Static fallback: if the app bundle fails to load entirely (so React never
           mounts), the user sees this designed message instead of a blank page.
           React replaces #root's contents on mount, so it only shows on failure.
           The fade animation delays it ~6s so a normal (slow) load doesn't flash it. -->
      <noscript style="color:#e8edf7;font-family:Arial,sans-serif;text-align:center;display:block;padding:3rem 1rem;">יש להפעיל JavaScript כדי להשתמש במערכת.</noscript>
      <div style="opacity:0;animation:bootfade 0s linear 6s forwards;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%, #0d1530, #070b16 70%);font-family:Arial,sans-serif;padding:1.5rem;">
        <div style="background:rgba(12,19,36,0.96);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:2.6rem 2rem;max-width:460px;text-align:center;color:#e8edf7;">
          <div style="font-size:3rem;">⚠️</div>
          <h1 style="font-size:1.5rem;font-weight:800;margin:.5rem 0;">אופס — משהו השתבש</h1>
          <p style="color:#94a3b8;line-height:1.7;margin:0 0 1.6rem;">לא הצלחנו לטעון את המערכת. נסו לרענן את הדף; אם הבעיה חוזרת, בדקו את החיבור לאינטרנט.</p>
          <a href="javascript:location.reload()" style="display:inline-block;background:linear-gradient(135deg,#3b82f6,#22d3ee);color:#04263a;font-weight:800;padding:.8rem 1.5rem;border-radius:999px;text-decoration:none;">↻ רענן</a>
        </div>
      </div>
      <style>@keyframes bootfade{to{opacity:1}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
