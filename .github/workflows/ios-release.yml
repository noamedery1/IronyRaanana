# ============================================================
# Signed iOS .ipa → App Store Connect / TestFlight, via the App Store Connect API key.
# ------------------------------------------------------------
# Uses AUTOMATIC signing driven by the ASC API key (no manual distribution cert / provisioning
# profile needed): xcodebuild -allowProvisioningUpdates creates the Apple Distribution cert + App
# Store provisioning profile on the fly, then the build is uploaded to TestFlight with the same key.
#
# **With no secrets it succeeds and skips** (so it never red-fails before the account is wired).
#
# ============================================================
# Secrets (Repo → Settings → Secrets and variables → Actions) — once, with the Apple account
# ============================================================
#   ASC_API_KEY_P8_BASE64   the App Store Connect API key .p8, base64-encoded:
#                             certutil -encode AuthKey_XXXX.p8 k.b64   (windows)
#                             base64 -i AuthKey_XXXX.p8 | pbcopy        (mac)
#   ASC_KEY_ID              the key id (e.g. T5Y2Q6SGZW)
#   ASC_ISSUER_ID          the API issuer id (Users and Access → Integrations)
#   IOS_TEAM_ID            the 10-char Apple Team ID (Membership page)
# Bundle id is com.techbynoam.squadio (set in the Xcode project). The key needs Admin/App Manager.
# ============================================================
name: iOS Release (IPA)

on:
  workflow_dispatch:
  # Build on feat/native-app whenever this workflow file changes (bump the counter to trigger),
  # since workflow_dispatch only works from the default branch and no workflows live on main.
  # rebuild: 4 (appendUserAgent=SquadioApp; iPhone-only; export-compliance)
  push:
    branches: [feat/native-app]
    paths:
      - ".github/workflows/ios-release.yml"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Signing secrets present?
        id: secrets
        env:
          K: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$K" ]; then
            echo "::notice::ASC_API_KEY_P8_BASE64 not set — skipping. See the header of this file."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          node-version: "22"
          cache: npm

      - name: Install deps + build web + sync ios
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Write ASC API key
        if: steps.secrets.outputs.ready == 'yes'
        id: key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # altool/xcodebuild look for the key here.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "$P8_B64" | base64 -d > "$P8"
          echo "path=$P8" >> "$GITHUB_OUTPUT"

      - name: Archive + export + upload
        if: steps.secrets.outputs.ready == 'yes'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8_PATH: ${{ steps.key.outputs.path }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          # Marketing + build versions from the run number (build must increase per upload).
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist 2>/dev/null || true

          # 1) Archive UNSIGNED for a generic iOS device. Signing is done at export, so the archive
          #    never tries to fetch a Development profile (which needs registered devices and fails).
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tail -60

          # 2) Export a signed App Store .ipa.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$P8_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tail -40

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then echo "::error::no .ipa produced"; exit 1; fi
          echo "::notice::signed IPA · $(du -h "$IPA" | cut -f1)"

          # 3) Upload to App Store Connect (TestFlight) with the API key.
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tail -30

          cp "$IPA" "$RUNNER_TEMP/Squadio.ipa"

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          name: squadio-ios-ipa
          path: ${{ runner.temp }}/Squadio.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean up key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 2>/dev/null || true
