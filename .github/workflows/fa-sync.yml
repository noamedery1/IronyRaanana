name: FA fixtures sync

# The Cloudflare cron (scheduled handler) hits an FA-blocked colo and 403s, even via the
# Durable Object. The fetch path (through the same DO) returns 200. So we trigger the worker's
# fetch handler on a schedule from here instead.
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3h (UTC)
  workflow_dispatch: {}

concurrency:
  group: fa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fa-proxy worker (fetch path → DO → FA)
        env:
          FA_WORKER_URL: ${{ secrets.FA_WORKER_URL }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 "$FA_WORKER_URL")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          test "$code" = "200"
