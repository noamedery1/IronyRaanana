# ============================================================
# iOS build (no Mac needed) — modeled on the SportDle project.
# ------------------------------------------------------------
# WHAT IT DOES: compiles the app for the iOS Simulator on a macOS
# runner. Catches compile errors, a broken plugin, and bad config
# long before there's a paid Apple Developer account. Capacitor 8
# uses Package.swift (SPM), so there is NO CocoaPods / Ruby step.
#
# WHAT IT DOES NOT DO: it does NOT produce an installable .ipa.
# That needs signing — a paid Apple Developer account, a
# distribution certificate + provisioning profile, added as repo
# secrets. Without signing Apple installs nothing on a real device.
#
# Manual run only (workflow_dispatch): macOS runners are billed at
# a higher rate, no reason to run on every push.
# ============================================================
name: iOS

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # Capacitor 8 requires >= 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web (dist)
        run: npm run build

      - name: Capacitor sync (copy web → ios)
        run: |
          out=$(npx cap sync ios 2>&1) || {
            echo "$out" | tail -30
            echo "::error::cap sync ios failed · $(echo "$out" | tail -1 | cut -c1-300)"
            exit 1
          }
          echo "$out" | tail -6

      # No signing. CODE_SIGNING_ALLOWED=NO is what lets it compile
      # without a certificate — the output targets the Simulator,
      # not a device. Fixed -derivedDataPath so the next step finds App.app.
      - name: xcodebuild — Simulator
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -40

      # Boot a simulator, install, launch, screenshot — so the iOS build can be
      # eyeballed with no Mac and no iPhone. Every simctl call is wrapped in a
      # timeout (a cold runner's bootstatus can hang indefinitely). Non-fatal:
      # the compile is what matters; the screenshot is a bonus.
      - name: Run in Simulator (screenshots)
        continue-on-error: true
        working-directory: ios/App
        run: |
          set +e
          APP=$(find build/Build/Products -maxdepth 3 -name "App.app" | head -1)
          if [ -z "$APP" ]; then echo "::warning::App.app not found"; exit 0; fi
          ID=$(xcrun simctl list devices available -j | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);const all=[].concat(...Object.values(j.devices));const p=all.find(x=>/iPhone 1[5-9]/.test(x.name))||all.find(x=>/iPhone/.test(x.name))||all[0];if(!p)process.exit(1);console.log(p.udid)})')
          if [ -z "$ID" ]; then echo "::warning::no simulator found"; exit 0; fi
          echo "::notice::simulator $ID"
          mkdir -p ../../store/sim
          xcrun simctl boot "$ID" 2>&1 | tail -3
          if ! timeout 300 xcrun simctl bootstatus "$ID" -b; then
            echo "::warning::simulator did not finish booting in 5 min"
            xcrun simctl shutdown "$ID" 2>/dev/null; exit 0
          fi
          timeout 120 xcrun simctl install "$ID" "$APP" || { echo "::warning::install failed"; exit 0; }
          timeout 60  xcrun simctl launch "$ID" com.squadio.app || { echo "::warning::launch failed"; exit 0; }
          for i in 1 2 3; do sleep 6; timeout 60 xcrun simctl io "$ID" screenshot "../../store/sim/ios-sim-$i.png"; done
          ls -la ../../store/sim/ || true
          xcrun simctl shutdown "$ID" 2>/dev/null
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squadio-ios-sim
          path: store/sim/
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: echo "::notice::iOS compiled. Simulator screenshots in the squadio-ios-sim artifact (if any). An installable .ipa needs an Apple Developer account + signing (see NATIVE_RELEASE.md)."
